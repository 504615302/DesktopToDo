name: Release

on:
  push:
    tags:
      - "v*"
      - "V*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/test_services.py
          python scripts/test_window.py
          python -m unittest tests.test_credential_service

      - name: Build Apple Silicon bundle
        run: bash scripts/build_macos_arm64.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DesktopToDo-macos-arm64
          path: |
            dist/DesktopToDo-macos-arm64-v*.tar.gz
            dist/DesktopToDo-macos-arm64-v*.tar.gz.sha256

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test
        run: |
          python scripts/test_services.py
          python scripts/test_window.py
          python -m unittest tests.test_credential_service

      - name: Build EXE
        run: |
          python scripts/make_icon.py
          python -m PyInstaller --noconfirm DesktopTODO.spec

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = python -c "from version import __version__; print(__version__)"
          echo "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          $langDir = Split-Path $iscc
          $langDir = Join-Path $langDir "Languages"
          New-Item -ItemType Directory -Force -Path $langDir | Out-Null
          Copy-Item installer\ChineseSimplified.isl (Join-Path $langDir "ChineseSimplified.isl") -Force
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.value }}" installer\DesktopToDo.iss
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Chinese language compile failed; retrying with English wizard."
            $iss = Get-Content installer\DesktopToDo.iss -Raw -Encoding UTF8
            $iss = $iss -replace '(?s)\[Languages\][^\[]*', "[Languages]`r`nName: `"english`"; MessagesFile: `"compiler:Default.isl`"`r`n`r`n"
            Set-Content installer\DesktopToDo.iss $iss -Encoding UTF8
            & $iscc "/DMyAppVersion=${{ steps.version.outputs.value }}" installer\DesktopToDo.iss
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DesktopToDo-windows
          path: |
            dist/DesktopTODO.exe
            dist/DesktopToDo-Setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
    needs:
      - windows
      - macos-arm64
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: DesktopToDo-windows
          path: dist/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: DesktopToDo-macos-arm64
          path: dist/macos

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows/DesktopTODO.exe
            dist/windows/DesktopToDo-Setup.exe
            dist/macos/DesktopToDo-macos-arm64-v*.tar.gz
            dist/macos/DesktopToDo-macos-arm64-v*.tar.gz.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
